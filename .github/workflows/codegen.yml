name: Symbolic patch generator

on:
  push:
    paths: ['tools/ofp_codegen/**', '.github/workflows/codegen.yml']
  pull_request:
    paths: ['tools/ofp_codegen/**', '.github/workflows/codegen.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/ofp_codegen/requirements.txt
      - run: python tools/ofp_codegen/validate.py --cxx g++ --output runs/codegen-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codegen-validation
          path: runs/codegen-validation
